<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Vote - TrueVote</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
body{font-family:Arial;background:#f5f7fb;display:flex;justify-content:center;padding:15px}
.card{background:#fff;max-width:500px;width:100%;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1);text-align:center}
video{width:100%;border-radius:10px;background:#000;transform:scaleX(-1)}
button{width:100%;padding:14px;margin-top:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:16px}
#startBtn{background:#0d6efd;color:#fff}
.candidate{padding:12px;margin-top:10px;background:#f1f1f1;border-radius:8px;cursor:pointer;border:2px solid transparent}
.candidate:hover{border-color:#0d6efd;background:#e8f0fe}
#status{margin-top:10px;color:#0d6efd;font-weight:bold}
</style></head><body>
<div class="card">
<h2>🔒 Face Liveness Check</h2>
<p>Hi <span id="userName"></span>, verify to vote</p>
<video id="video" autoplay muted playsinline></video>
<div id="status">Loading AI Models... Please wait 5 sec</div>
<div>Blinks: <span id="blinkCount">0 / 2</span></div>
<button id="startBtn">▶️ Click Start Verification</button>
<div id="voteArea" style="display:none;margin-top:15px">
<h3>Select Party to Vote</h3>
<div class="candidate" onclick="vote('BJP')">🪷 BJP</div>
<div class="candidate" onclick="vote('Congress')">✋ Congress</div>
<div class="candidate" onclick="vote('AAP')">🧹 AAP</div>
<div class="candidate" onclick="vote('NOTA')">NOTA</div>
</div>
</div>
<script>
const video=document.getElementById('video'), status=document.getElementById('status'), blinkCount=document.getElementById('blinkCount');
let blink=0, verified=false, isClose=false;
const user=JSON.parse(localStorage.getItem('user')||'{}');
document.getElementById('userName').textContent=user.name||'voter';
(async()=>{
  const M='https://justadudewhohacks.github.io/face-api.js/models';
  await faceapi.nets.tinyFaceDetector.loadFromUri(M);
  await faceapi.nets.faceLandmark68Net.loadFromUri(M);
  await faceapi.nets.ssdMobilenetv1.loadFromUri(M);
  status.textContent='✅ AI Ready! Click Start Verification';
})();
document.getElementById('startBtn').onclick=async()=>{
  video.srcObject=await navigator.mediaDevices.getUserMedia({video:true});
  status.textContent='Come Close My Friend';
  document.getElementById('startBtn').style.display='none';
  setInterval(async()=>{
    if(verified) return;
    const det=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
    if(!det) return;
    const box=det.detection.box;
    const boxPer=(box.width*box.height)/(video.videoWidth*video.videoHeight)*100;
    const leftEye=det.landmarks.getLeftEye(), rightEye=det.landmarks.getRightEye();
    const ear=(dist(leftEye[1],leftEye[5])+dist(leftEye[2],leftEye[4]))/(2*dist(leftEye[0],leftEye[3]));
    if(boxPer>12) { if(!isClose){status.textContent='Go Back Slightly';} isClose=true; }
    if(boxPer<5 && isClose){ status.textContent='Come Close My Friend'; isClose=false; }
    if(ear<0.25 && isClose){
      blink++; blinkCount.textContent=blink+' / 2';
      status.textContent= blink==1?'One Done, Blink Twice!':'Liveness Passed!';
      await new Promise(r=>setTimeout(r,1000));
      if(blink>=2){ verified=true; status.textContent='✅ Verified! You can Vote Now'; document.getElementById('voteArea').style.display='block'; }
    }
    if(!verified && isClose && blink==0) status.textContent='Blink Once!';
  },300);
};
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
async function vote(party){
  const res=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aadharNumber:user.aadharNumber,votedFor:party})});
  const data=await res.json(); alert(data.message); if(res.ok) location.href='results.html';
}
</script></body></html>
